<!DOCTYPE html>
<html>
<head>
  <title>Account Verification Required</title>
</head>
<body>
  <h1>Your Account Requires Verification</h1>

  <p>⚠️ Your account will be suspended unless you verify it immediately.</p>
  <p>Limited time: verify within 10 minutes.</p>

  <form>
    <label>Email</label>
    <input type="email" name="email">

    <label>Password</label>
    <input type="password" name="password">

    <button type="submit">Verify Account Now</button>
  </form>
</body>
</html>
