<!DOCTYPE html>
<html>
<head>
  <title>Security Verification Required</title>
</head>
<body>
  <h1>Verify Your Account</h1>

  <p>
    Your account has been flagged for unusual activity.
    You must verify your identity immediately to avoid suspension.
  </p>

  <p>
    Failure to verify your account today may result in permanent account closure.
  </p>

  <form>
    <label>Email address:</label><br>
    <input type="email" name="email"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password"><br><br>

    <button type="submit">Verify Account Now</button>
  </form>

  <p>Security Team — Account Verification Center</p>
</body>
</html>
